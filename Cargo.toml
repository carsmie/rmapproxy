[package]
name = "rmapproxy"
version = "0.1.0"
edition = "2024"
description = "Rust replacement for the MapProxy features tnt-mapproxy uses (WMTS tiles from WMS sources, file cache, seeding)"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
crs-definitions = "0.6.0"
futures = "0.3"
httpdate = "1.0.3"
libc = "0.2"
md-5 = "0.10"
parking_lot = "0.12.5"
png = "0.18.1"
proj4rs = "0.2.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
debug = 1
