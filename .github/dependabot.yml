version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # One weekly PR for minor/patch crate churn; majors stay separate for review.
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
